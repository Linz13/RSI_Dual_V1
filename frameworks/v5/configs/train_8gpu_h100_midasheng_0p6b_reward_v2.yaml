extends: train_8gpu_h100.yaml

run:
  output_dir: ../runs/dual_recursive_8gpu_h100_midasheng_0p6b_reward_v2

captioner:
  python: ../../../miniconda3/envs/midasheng-0p6b-captioner/bin/python
  worker_module: scripts.midasheng_0p6b_captioner_candidate
  model_path: ../../models/MiDashengLM-0.6B-FP32
  model_repo: midasheng/midashenglm-0.6b-fp32
  adapter_path: ""
  # The ModelScope snapshot is FP32; keeping this branch FP32 avoids NaN logits
  # in the 0.6B audio/text path that appears when the snapshot is cast to BF16.
  dtype: float32
  attn_implementation: sdpa
  gradient_checkpointing: true
  generation:
    max_new_tokens: 384
    rollout_batch_size: 1
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    max_attempts_per_candidate: 1
  lora:
    r: 4
    alpha: 8
    dropout: 0.0
    target_modules: '^decoder\.model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))$|^audio_projector\.net\.(0|2)$'
  training:
    replay_batch_size: 1
    grpo_backward_chunk_tokens: 16

tts:
  adapter_path: ""
  codec_cache_dir: $DUALISL_RUN_DIR/codec_cache/qwen3tts_12hz

training:
  round_offset: 0
