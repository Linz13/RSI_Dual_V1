extends: train_8gpu_h100.yaml

run:
  output_dir: ../runs/dual_recursive_8gpu_h100_qwen2_5_omni_3b_reward_v2

captioner:
  python: ../../../miniconda3/envs/qwen2_5-omni-3b-captioner/bin/python
  worker_module: scripts.qwen2_5_omni_3b_captioner_candidate
  model_path: ../../models/Qwen2.5-Omni-3B
  model_repo: Qwen/Qwen2.5-Omni-3B
  adapter_path: ""
  dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  generation:
    max_new_tokens: 384
    rollout_batch_size: 1
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    max_attempts_per_candidate: 1
    eos_token: <|im_end|>
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_modules: '^model\.layers\.\d+\.self_attn\.(q_proj|k_proj|v_proj|o_proj)$|^audio_tower\.layers\.\d+\.self_attn\.(q_proj|k_proj|v_proj|out_proj)$'
  training:
    replay_batch_size: 1
    grpo_backward_chunk_tokens: 16

tts:
  adapter_path: ""
  codec_cache_dir: $DUALISL_RUN_DIR/codec_cache/qwen3tts_12hz

training:
  round_offset: 0
