    initial_path: ''
  counterfactuals_per_candidate: 3
  anchor_penalty_weight: 0.25
  anchor_tolerance_z: 0.5
  cycle_sft_selection: semantic_top1
  sft_gate:
    diagnostic_only: true
    target_precision: 0.9
    min_recall: 0.25
  validity:
    audio_only:
      min_asr_score: 0.0
    caption_only:
      min_audio_health: 0.5
      min_asr_score: 0.0
  audio_only:
    reconstruction_weight: 0.9
    counterfactual_weight: 0.5
    format_weight: 0.1
  caption_only:
    reconstruction_weight: 0.5
    counterfactual_weight: 0.5
synchronization:
