  seed: 42
  inline_mock: false
distributed:
  enabled: true
  world_size: 8
  backend: nccl
  timeout_seconds: 21600
data:
  paired_path: /data/L202500147/Caption/training_data_v2/paired.jsonl
  audio_only_path: /data/L202500147/Caption/training_data_v2/audio_only.jsonl
  caption_only_path: /data/L202500147/Caption/training_data_v2/caption_only.jsonl
  strict_disjoint: true
  hash_audio: true
  duration:
    min: 1.2
    max: 30.0
captioner:
  python: /data/L202500147/miniconda3/envs/midasheng-captioner/bin/python3.10
  worker_module: scripts.midasheng_captioner_candidate
  model_path: /data/L202500147/Caption/models/MiDashengLM-7B-1021-BF16
  adapter_path: ''
  device: cuda:0
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  generation:
    max_new_tokens: 384
    rollout_batch_size: 4
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    max_attempts_per_candidate: 1
    eos_token: <|im_end|>
    batch_fallback: true
  lora:
    r: 4
    alpha: 8
    dropout: 0.0
    target_modules: ^decoder\.model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))$|^audio_projector\.net\.(0|2)$
  training:
    lr: 1.0e-06
    weight_decay: 0.01
    clip_range: 0.2
    kl_beta: 0.02
    grad_clip: 1.0
    replay_batch_size: 1
    grpo_backward_chunk_tokens: 16
    phases:
      grpo:
        epochs: 1
        lr: 1.0e-06
        shuffle: true
      cycle_sft:
        epochs: 1
        lr: 5.0e-06
        shuffle: true
tts:
  python: /data/L202500147/miniconda3/envs/qwen3-tts/bin/python3.12
  worker_module: dual_isl_train.workers.qwen_voice_design
  model_path: /data/L202500147/Caption/models/Qwen3-TTS-12Hz-1.7B-VoiceDesign
  tokenizer_path: /data/L202500147/Caption/models/Qwen3-TTS-Tokenizer-12Hz
  codec_cache_dir: /data/L202500147/Caption/DualISL_Train_RewardV5_LabelRobust/runs/midasheng_v5_label_robust_10rounds_8gpu_run01/codec_cache/qwen3tts_12hz
  adapter_path: ''
  device: cuda:0
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  num_codebooks: 16
  generation:
    max_new_tokens: 512
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    subtalker_temperature: 1.0
    subtalker_top_p: 1.0
    subtalker_top_k: 0
    repetition_penalty: 1.0
    reference_replay_reuse: true
    rollout_schedule: previous_round_lpt
    synthesis_batch_size: 4
    rollout_batch_size: 1
    batch_fallback: true
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
  training:
    lr: 1.0e-06
    weight_decay: 0.01
    sub_talker_weight: 0.3
    clip_range: 0.2
    kl_beta: 0.02
    grad_clip: 1.0
    phases:
      grpo:
        epochs: 1
        lr: 1.0e-06
        shuffle: true
        schedule: length_bucketed
        heartbeat_frames: 32
      cycle_sft:
        epochs: 1
        lr: 2.0e-06
        shuffle: true
critics:
  python: /data/L202500147/miniconda3/envs/dualisl-critic/bin/python3.10
  worker_module: dual_isl_train.workers.critics
  device: cuda:0
  whisper_model: /data/L202500147/Caption/models/whisper/large-v3-turbo.pt
  whisper_download_root: /data/L202500147/Caption/models/whisper
training:
  rounds: 10
  group_size: 4
  warmstart: false
  anchor_mode: all_paired_once
  round_offset: 0
  paired_anchor_enabled: true
reward:
